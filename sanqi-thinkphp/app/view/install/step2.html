<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$pageTitle} - 安装向导</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { background: var(--bodys); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .install-box { width: 100%; max-width: 520px; max-height: calc(100vh - 40px); background: var(--cobg); border-radius: 8px; overflow-y: auto; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
        .install-logo { padding: 30px 0 20px; text-align: center; }
        .install-logo h1 { font-size: 22px; color: var(--textqh); font-weight: 600; }
        .install-logo p { font-size: 13px; color: var(--texths); margin-top: 6px; }
        .install-steps { display: flex; justify-content: center; gap: 8px; padding: 0 20px 20px; }
        .install-step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texths); }
        .install-step.active { color: var(--theme); font-weight: 600; }
        .install-step.done { color: var(--theme); }
        .install-step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--fgxys); color: var(--texths); display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .install-step.active .install-step-num, .install-step.done .install-step-num { background: var(--theme); color: #fff; }
        .install-body { padding: 0 25px 30px; }
        .install-body h2 { font-size: 16px; color: var(--textqh); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--textqh); margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; height: 40px; border: none; border-bottom: 1px solid var(--fgxys); background: transparent; font-size: 14px; color: var(--textqh); outline: none; padding: 0; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--theme); }
        .form-hint { font-size: 12px; color: var(--texths); margin-top: 4px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .install-btn { width: 100%; height: 42px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        .install-btn-primary { background: var(--theme); color: #fff; }
        .install-btn-primary:hover { opacity: 0.9; }
        .install-btn-gray { background: var(--backbg); color: var(--textqh); }
        .alert { padding: 12px 15px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
        .alert-ok { background: rgba(9,195,98,0.1); color: var(--theme); }
        .alert-err { background: rgba(255,85,33,0.1); color: var(--protext); }
        .btn-row { display: flex; gap: 10px; margin-top: 25px; }
        .btn-row .install-btn { flex: 1; }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.show { display: block; }
        .spinner { width: 28px; height: 28px; border: 3px solid var(--fgxys); border-top-color: var(--theme); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 13px; color: var(--texths); }
        @media (max-width: 520px) {
            body { align-items: flex-start; padding: 12px; }
            .install-box { max-width: none; max-height: none; min-height: calc(100vh - 24px); border-radius: 6px; }
            .install-logo { padding: 22px 16px 14px; }
            .install-steps { justify-content: flex-start; overflow-x: auto; padding: 0 16px 16px; }
            .install-step { flex: 0 0 auto; }
            .install-body { padding: 0 16px 24px; }
            .form-row, .btn-row { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="install-box">
        <div class="install-logo">
            <h1>sanqi 朋友圈</h1>
            <p>安装向导</p>
        </div>
        <div class="install-steps">
            <div class="install-step done"><span class="install-step-num">&#10003;</span><span>环境</span></div>
            <div class="install-step active"><span class="install-step-num">2</span><span>数据库</span></div>
            <div class="install-step"><span class="install-step-num">3</span><span>管理员</span></div>
            <div class="install-step"><span class="install-step-num">4</span><span>完成</span></div>
        </div>
        <div class="install-body">
            <h2>数据库配置</h2>
            <div id="msg"></div>
            <form id="db-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>数据库主机</label>
                        <input type="text" name="host" value="{$dbConfig.host}" required>
                    </div>
                    <div class="form-group">
                        <label>端口</label>
                        <input type="text" name="port" value="{$dbConfig.port}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>数据库名</label>
                    <input type="text" name="database" value="{$dbConfig.database}" required>
                    <div class="form-hint">不存在会自动创建</div>
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" value="{$dbConfig.username}" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" value="">
                </div>
                <div class="form-group">
                    <label>表前缀</label>
                    <input type="text" name="prefix" value="{$dbConfig.prefix}" placeholder="留空无前缀">
                </div>
            </form>
            <div id="loading" class="loading"><div class="spinner"></div><p>测试连接中...</p></div>
            <div class="btn-row">
                <a href="/install" class="install-btn install-btn-gray" style="display:block;text-align:center;line-height:42px;text-decoration:none;">上一步</a>
                <button type="button" class="install-btn install-btn-primary" onclick="testDb()">测试连接</button>
            </div>
            <div id="next-row" style="margin-top:10px;display:none;">
                <button type="button" class="install-btn install-btn-primary" onclick="goNext()">下一步</button>
            </div>
        </div>
    </div>
    <script>
    function testDb() {
        var f = document.getElementById('db-form');
        var fd = new FormData(f);
        document.getElementById('loading').classList.add('show');
        document.getElementById('msg').innerHTML = '';
        fetch('/install/testDb', { method: 'POST', body: fd })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                document.getElementById('loading').classList.remove('show');
                if (d.code == 200) {
                    document.getElementById('msg').innerHTML = '<div class="alert alert-ok">' + d.msg + '</div>';
                    document.getElementById('next-row').style.display = 'block';
                } else {
                    document.getElementById('msg').innerHTML = '<div class="alert alert-err">' + d.msg + '</div>';
                }
            })
            .catch(function(e) {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('msg').innerHTML = '<div class="alert alert-err">请求失败: ' + e.message + '</div>';
            });
    }
    function goNext() {
        var f = document.getElementById('db-form');
        var fd = new FormData(f);
        var c = {};
        fd.forEach(function(v, k) { c[k] = v; });
        sessionStorage.setItem('db_config', JSON.stringify(c));
        location.href = '/install/step3';
    }
    </script>
</body>
</html>
