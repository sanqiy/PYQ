<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$pageTitle} - 安装向导</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { background: var(--bodys); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .install-box { width: 100%; max-width: 520px; max-height: calc(100vh - 40px); background: var(--cobg); border-radius: 8px; overflow-y: auto; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
        .install-logo { padding: 30px 0 20px; text-align: center; }
        .install-logo h1 { font-size: 22px; color: var(--textqh); font-weight: 600; }
        .install-logo p { font-size: 13px; color: var(--texths); margin-top: 6px; }
        .install-body { padding: 0 25px 30px; text-align: center; }
        .done-icon { font-size: 60px; margin-bottom: 15px; }
        .done-title { font-size: 18px; color: var(--protext); font-weight: 600; margin-bottom: 10px; }
        .done-text { font-size: 14px; color: var(--texths); line-height: 1.8; }
        .done-text code { background: var(--fgxys); padding: 2px 6px; border-radius: 3px; font-size: 13px; }
        .done-links { display: flex; gap: 10px; margin-top: 25px; }
        .done-links a { flex: 1; height: 42px; border-radius: 4px; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
        .done-links .link-home { background: var(--backbg); color: var(--textqh); }
        .done-links .link-admin { background: var(--theme); color: #fff; }
        @media (max-width: 520px) {
            body { align-items: flex-start; padding: 12px; }
            .install-box { max-width: none; max-height: none; min-height: calc(100vh - 24px); border-radius: 6px; }
            .install-logo { padding: 22px 16px 14px; }
            .install-body { padding: 0 16px 24px; }
            .done-links { flex-direction: column; gap: 10px; }
            .done-links a { flex: none; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="install-box">
        <div class="install-logo">
            <h1>sanqi 朋友圈</h1>
            <p>安装向导</p>
        </div>
        <div class="install-body">
            <div class="done-icon">&#9888;</div>
            <div class="done-title">已经安装</div>
            <div class="done-text">
                系统已安装，无需重复安装<br>
                如需重装，请删除 <code>runtime/install.lock</code>
            </div>
            <div class="done-links">
                <a href="/" class="link-home">访问前台</a>
                <a href="/admin" class="link-admin">进入后台</a>
            </div>
        </div>
    </div>
</body>
</html>
