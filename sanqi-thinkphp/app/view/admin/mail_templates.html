{extend name="admin/layout" /}

{block name="content"}
<form id="mailTemplateForm">
    {volist name="templates" id="template"}
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">{$template.name}</h5>
            <small class="text-muted">可用变量：{:($vars[$key] ?? '')}</small>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label>邮件标题</label>
                <input class="form-control" name="templates[{$key}][subject]" value="{$template.subject}">
            </div>
            <div class="form-group">
                <label>邮件正文（支持 HTML）</label>
                <textarea class="form-control" rows="6" name="templates[{$key}][body]">{$template.body}</textarea>
            </div>
        </div>
    </div>
    {/volist}
    <button type="submit" class="btn btn-primary">保存模板</button>
</form>
{/block}

{block name="extraJs"}
<script>
$('#mailTemplateForm').on('submit', function(e) {
    e.preventDefault();
    ajaxRequest('/admin/mail-templates/save', $(this).serialize(), function() {
        alert('保存成功');
    });
});
</script>
{/block}
